<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - StudyFit AI</title>

    <link rel="stylesheet" href="css files/style.css">

</head>

<body>

    <div class="container">

        <h1>👩‍🎓 Student Profile</h1>

        <p>Let's create your StudyFit profile</p>

        <form id="studentForm">

            <label for="name">
                Name
            </label>

            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">
                Email
            </label>

            <input type="email" id="email" placeholder="Enter your email" required>

            <button type="submit">
                Continue 🚀
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script src="js files/student.js"></script>

</body>

</html>
